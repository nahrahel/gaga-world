<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UI test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    /* Static stand-in for the studio: a grey room and a dark figure, so composition can be judged. */
    .fake-stage { position: fixed; inset: 0; background: linear-gradient(180deg, #f4f4f2 0%, #ebebe8 56%, #dcdcd8 56.2%, #d3d3cf 100%); overflow: hidden; }
    .fake-stage::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 56%; background: repeating-linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,.55) 18% 26%, transparent 26% 34%); opacity: .7; }
    .fake-stage svg { position: absolute; left: 50%; top: 50%; height: 64vh; translate: -50% -50%; filter: blur(.4px); transition: left 1.1s cubic-bezier(.22,.61,.36,1), top 1.1s cubic-bezier(.22,.61,.36,1), height 1.1s cubic-bezier(.22,.61,.36,1); }
    .fake-stage .free { position: absolute; border: 1px dashed rgba(0,0,0,.18); display: none; }
    body.show-free .fake-stage .free { display: block; }
    #log { position: fixed; right: 8px; bottom: 8px; z-index: 99; font: 10px/1.3 ui-monospace, monospace; color: #555; display: none; }
  </style>
</head>
<body>
  <div class="fake-stage" aria-hidden="true">
    <div class="free"></div>
    <svg viewBox="0 0 120 260">
      <ellipse cx="60" cy="252" rx="46" ry="5" fill="rgba(0,0,0,.14)"/>
      <g fill="#2a2a29" stroke="#2a2a29" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="62" cy="22" rx="10" ry="12.5" transform="rotate(8 62 22)"/>
        <path d="M57 36 L66 36 L68 44 L56 44 Z"/>
        <path d="M44 50 C52 44 72 44 80 50 L78 84 C76 96 74 104 75 118 L48 118 C48 104 46 96 45 84 Z"/>
        <path d="M47 112 C52 124 72 126 76 112 L78 132 L46 132 Z"/>
        <path d="M46 52 C38 70 30 84 22 100 C18 108 14 114 10 120" stroke-width="9" fill="none"/>
        <path d="M78 52 C88 60 98 64 104 52 C108 44 110 36 112 28" stroke-width="8.5" fill="none"/>
        <path d="M52 128 C50 160 46 190 44 220 L42 246" stroke-width="13" fill="none"/>
        <path d="M70 128 C74 160 80 186 84 214 L90 240" stroke-width="12" fill="none"/>
        <path d="M36 248 L48 248" stroke-width="6"/><path d="M88 244 L100 246" stroke-width="6"/>
      </g>
    </svg>
  </div>
  <div id="ui" class="ui"></div>
  <pre id="log"></pre>
  <script type="module">
    import { VOCAB, CLASS_SCRIPTS } from '../src/vocab.js';
    import { createUI } from '../src/ui/ui.js';
    import { createAudio } from '../src/ui/audio.js';

    const params = new URLSearchParams(location.search);
    if (params.get('free')) document.body.classList.add('show-free');
    const state = params.get('state') || 'entry';
    const log = (window.__log = []);
    const rec = (who, name, args) => log.push([who, name, ...args]);
    if (params.get('fresh') !== '0') { try { localStorage.removeItem('gaga-world:settings:v1'); localStorage.removeItem('gaga-world:coach:v1'); } catch {} }

    // ---- mock engine: same API as src/motion/engine.js, simple linear envelopes ----
    function createMockEngine(vocab) {
      const known = new Set(vocab.map((v) => v.id));
      const layers = new Map();
      const subs = new Map();
      let t = 0, accentT = 0;
      const emit = (e, p) => subs.get(e)?.forEach((cb) => cb(p));
      const list = () => [...layers.values()].sort((a, b) => a.addedAt - b.addedAt).map((L) => ({ ...L }));
      const api = {
        addPerformer(fig, o) { rec('engine', 'addPerformer', [o]); return 1; },
        removePerformer(id) { rec('engine', 'removePerformer', [id]); },
        setLayer(id, target) {
          rec('engine', 'setLayer', [id, target]);
          if (!known.has(id)) return;
          target = Math.min(1, Math.max(0, Number(target) || 0));
          let L = layers.get(id);
          if (!L) { if (target <= 0) return; L = { id, target: 0, value: 0, addedAt: t + layers.size * 1e-6 }; layers.set(id, L); }
          L.target = target;
          emit('layers', list());
        },
        toggleLayer(id, d = 0.7) {
          rec('engine', 'toggleLayer', [id]);
          const L = layers.get(id);
          api.setLayer(id, L && L.target > 0 ? 0 : d);
        },
        releaseAll() { rec('engine', 'releaseAll', []); for (const L of layers.values()) L.target = 0; emit('layers', list()); },
        getLayers: list,
        accent(id) { rec('engine', 'accent', [id]); accentT = 1; },
        getActivity() {
          let e = 0; for (const L of layers.values()) e += L.value * 0.45;
          e = Math.min(1, 0.12 + e + accentT * 0.5);
          return { regions: { center: e, pelvis: e, spine: e, arms: e, hands: e, legs: e, feet: e, head: e, flesh: e }, energy: e, tempo: 0.4 + e, dominant: list().slice(-1)[0]?.id || null };
        },
        getGlowPoints() { return []; },
        getFleshParams() { return { gain: 0.5, stiffness: 1, damping: 0.5 }; },
        update(dt) {
          t += dt; accentT = Math.max(0, accentT - dt * 1.5);
          for (const [id, L] of layers) {
            const rate = L.value < L.target ? dt / 1.3 : dt / 2.2;
            L.value = L.value < L.target ? Math.min(L.target, L.value + rate) : Math.max(L.target, L.value - rate);
            if (L.target <= 0 && L.value <= 0.0005) { layers.delete(id); emit('layers', list()); }
          }
        },
        on(e, cb) { if (!subs.has(e)) subs.set(e, new Set()); subs.get(e).add(cb); return () => subs.get(e).delete(cb); },
      };
      return api;
    }

    function createMockCameras() {
      const subs = new Set(), studySubs = new Set();
      const modes = ['orbit', 'walk', 'join', 'director'];
      const cam = {
        mode: 'orbit',
        studyViews: [['three', 'Three-quarter'], ['front', 'Front'], ['side', 'Side'], ['back', 'Back'], ['overhead', 'Overhead'], ['hands', 'Hands'], ['feet', 'Feet'], ['spine', 'Spine'], ['pelvis', 'Pelvis']].map(([id, label]) => ({ id, label })),
        study(v) { rec('cameras', 'study', [v]); if (cam.mode !== 'orbit') { cam.mode = 'orbit'; subs.forEach((cb) => cb('orbit')); } studySubs.forEach((cb) => cb(v)); },
        setMode(m) { rec('cameras', 'setMode', [m]); if (!modes.includes(m)) return; cam.mode = m; subs.forEach((cb) => cb(m)); },
        cycle() { rec('cameras', 'cycle', []); cam.setMode(modes[(modes.indexOf(cam.mode) + 1) % modes.length]); },
        focus(b) { rec('cameras', 'focus', [b]); },
        update() {},
        // Mock framing: centre the stand-in dancer in the area the UI leaves free, as the real camera will.
        setInsets(ins) {
          rec('cameras', 'setInsets', [ins.top, ins.right, ins.bottom, ins.left]);
          const W = innerWidth, H = innerHeight, svg = document.querySelector('.fake-stage svg'), box = document.querySelector('.fake-stage .free');
          const x0 = ins.left, x1 = W - ins.right, y0 = ins.top, y1 = H - ins.bottom;
          const h = Math.max(120, Math.min(H * 0.64, (y1 - y0) * 0.9));
          Object.assign(svg.style, { left: `${(x0 + x1) / 2}px`, top: `${(y0 + y1) / 2}px`, height: `${h}px` });
          Object.assign(box.style, { left: `${x0}px`, top: `${y0}px`, width: `${x1 - x0}px`, height: `${y1 - y0}px` });
        },
        on(e, cb) { if (e === 'mode') subs.add(cb); if (e === 'study') studySubs.add(cb); },
      };
      return cam;
    }

    // Mock of the integrator's app object (src/main.js): dancer-time controls.
    function createMockApp(cameras, vocab) {
      const app = {
        speed: 1, paused: false, trails: false,
        setSpeed(x) { rec('app', 'setSpeed', [x]); app.speed = [0.25, 0.5, 1].includes(x) ? x : 1; },
        setPaused(p) { rec('app', 'setPaused', [!!p]); app.paused = !!p; },
        step() { rec('app', 'step', []); app.paused = true; app._step = (app._step || 0) + 1 / 30; },
        setTrails(on) { rec('app', 'setTrails', [!!on]); app.trails = !!on; },
        study(v) { rec('app', 'study', [v]); cameras.study(v); },
        show(id) {
          rec('app', 'show', [id]);
          const v = vocab.find((w) => w.id === id); if (!v) return null;
          const p = v.show || { view: 'three', speed: 1 };
          app.speed = p.speed; app.paused = false; app.trails = !!p.trails; cameras.study(p.view);
          return p;
        },
      };
      return app;
    }

    const wrap = (who, obj) => new Proxy(obj, {
      get(target, key) {
        const v = target[key];
        if (typeof v !== 'function' || key === 'update') return v;
        return (...args) => { rec(who, String(key), args.map((a) => (typeof a === 'string' || typeof a === 'number' || typeof a === 'boolean' ? a : typeof a))); return v.apply(target, args); };
      },
    });

    const engine = createMockEngine(VOCAB);
    const cameras = createMockCameras();
    const figures = [0, 1].map((i) => ({ setMaterial: (m) => rec('figure' + i, 'setMaterial', [m]) }));
    const post = { setQuality: (q) => rec('post', 'setQuality', [q]) };
    const studio = { setQuality: (q) => rec('studio', 'setQuality', [q]) };
    const audio = wrap('audio', createAudio());
    const app = createMockApp(cameras, VOCAB);

    const ui = createUI({ vocab: VOCAB, scripts: CLASS_SCRIPTS, engine, cameras, audio, figures, post, studio, app });
    ui.on('settings', (s, key) => rec('ui', 'settings', [key, String(s[key])]));
    ui.on('enter', () => rec('ui', 'enter', []));
    window.__ui = ui; window.__engine = engine; window.__cameras = cameras; window.__app = app;

    const sim = (seconds, step = 0.05) => {
      for (let s = 0; s < seconds; s += step) { ui.update(step); engine.update(step, s); }
    };

    // ---- staged states for screenshots ----
    const stage = {
      entry() {},
      explore() { ui.begin('explore'); },
      coach2() { ui.begin('explore'); setTimeout(() => document.querySelector('.word[data-id="lena"] .word-btn').click(), 1200); },
      empty() { ui.enter(); },
      study() { ui.begin('study'); sim(1.5); },
      layers() {
        ui.enter();
        engine.setLayer('float', 0.62); sim(1.2);
        engine.setLayer('lena', 0.8); sim(1.4);
        engine.setLayer('snake', 0.5); sim(0.9);
        ui.openCard(params.get('card') || 'lena');
      },
      releasing() {
        ui.enter();
        engine.setLayer('float', 0.6); engine.setLayer('lunas', 0.7); engine.setLayer('shake', 0.9); engine.setLayer('thick', 0.4); sim(3);
        setTimeout(() => engine.setLayer('lunas', 0), Number(params.get('at') || 2300));
      },
      teach() {
        ui.begin('class');
        const until = Number(params.get('t') || 96);
        for (let s = 0; s < until; s += 0.25) { ui.update(0.25); engine.update(0.25, s); }
      },
      countdown() {
        ui.begin('class');
        for (let s = 0; s < 450; s += 0.25) { ui.update(0.25); engine.update(0.25, s); }
        let n = 0;
        const iv = setInterval(() => { ui.update(0.25); engine.update(0.25, 0); if (++n > 44) clearInterval(iv); }, 60);
      },
      settings() { ui.enter(); engine.setLayer('float', 0.6); sim(2); ui.openPanel('settings'); },
      views() { ui.enter(); engine.setLayer('float', 0.6); sim(2); ui.openPanel('views'); },
      classes() { ui.enter(); ui.openPanel('classes'); },
      about() { ui.enter(); ui.openPanel('about'); },
      'entry-about'() { ui.openPanel('about'); },
      help() { ui.enter(); ui.openPanel('help'); },
      more() {
        ui.enter();
        engine.setLayer('float', 0.6); engine.setLayer('groove', 0.7); engine.setLayer('explosive', 0.5); sim(2.5);
        ui.setMore(true);
        setTimeout(() => ui.preview(params.get('pv') || 'groove'), 900);
      },
      accent() { ui.enter(); engine.setLayer('float', 0.6); engine.setLayer('explosive', 0.6); sim(2); ui.openCard('explosive'); },
      hidden() { ui.enter(); engine.setLayer('float', 0.6); sim(1); ui.setHidden(true); },
      map() { ui.enter(); engine.setLayer('lena', 0.7); engine.setLayer('snake', 0.5); sim(2); document.querySelector('.sb-btn[aria-label="Sensation map"]').click(); },
      join() { ui.enter(); engine.setLayer('float', 0.6); sim(1); cameras.setMode('join'); },
      release() {
        ui.begin('class');
        for (let s = 0; s < Number(params.get('t') || 85); s += 0.25) { ui.update(0.25); engine.update(0.25, s); }
      },
    };
    (stage[state] || stage.entry)();

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(Math.max((now - last) / 1000, 0), 1 / 20);
      last = now;
      ui.update(dt);
      const ddt = app.paused ? (app._step || 0) : dt * app.speed; app._step = 0;
      engine.update(ddt, now / 1000);
      audio.update(dt, engine.getActivity(), engine.getLayers());
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if (params.get('log')) { const el = document.getElementById('log'); el.style.display = 'block'; setInterval(() => { el.textContent = log.slice(-14).map((r) => r.join(' ')).join('\n'); }, 300); }
  </script>
</body>
</html>
